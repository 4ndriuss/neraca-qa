[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neraca-qa"
version = "0.1.0"
description = "Tanya-jawab laporan keuangan emiten BEI dengan perhitungan terverifikasi dan sitasi halaman."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
neraca-xbrl = "neraca.ingest.xbrl:main"

[tool.setuptools.packages.find]
where = ["src"]
